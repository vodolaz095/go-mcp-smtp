name: make release

# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: go.sum

      - name: install govulncheck utility
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: install golint utility
        run: go install golang.org/x/lint/golint@latest

      - name: install staticcheck utility
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: lint
        run: make lint

      - name: scan for vulnerable packages
        run: make vuln

      - name: run unit test
        run: go test -v --cover ./...

      - name: Create build directory
        run: mkdir -p build

      - name: Build binary for Linux on AMD64
        env:
          GOOS: linux
          CGO_ENABLED: 0
          GOARCH: amd64
        run: go build -ldflags "-s -w -X main.Version=${{ github.sha }}" -o build/go-mcp-smtp_linux_amd64 main.go

      - name: Build binary for Linux on ARM 6
        env:
          GOOS: linux
          CGO_ENABLED: 0
          GOARCH: arm
          GOARM: 6
        run: go build -ldflags "-s -w -X main.Version=${{ github.sha }}" -o build/go-mcp-smtp_linux_arm6 main.go

      - name: Build binary for Linux on ARM 7
        env:
          GOOS: linux
          CGO_ENABLED: 0
          GOARCH: arm
          GOARM: 7
        run: go build -ldflags "-s -w -X main.Version=${{ github.sha }}" -o build/go-mcp-smtp_linux_arm7 main.go

      - name: Build binary for Linux on ARM64
        env:
          GOOS: linux
          CGO_ENABLED: 0
          GOARCH: arm64
        run: go build -ldflags "-s -w -X main.Version=${{ github.sha }}" -o build/go-mcp-smtp_linux_arm64 main.go

      - name: Build binary for Windows on AMD64
        env:
          GOOS: windows
          CGO_ENABLED: 0
          GOARCH: amd64
        run: go build -ldflags "-s -w -X main.Version=${{ github.sha }}" -o build/dashboard.exe main.go

      - name: Build binary for macOS on AMD64
        env:
          GOOS: darwin
          CGO_ENABLED: 0
          GOARCH: amd64
        run: go build -ldflags "-s -w -X main.Version=${{ github.sha }}" -o build/go-mcp-smtp_darwin_amd64 main.go

      - name: Build binary for macOS on ARM64 (M1/M2)
        env:
          GOOS: darwin
          CGO_ENABLED: 0
          GOARCH: arm64
        run: go build -ldflags "-s -w -X main.Version=${{ github.sha }}" -o build/go-mcp-smtp_darwin_arm64 main.go

      - name: Make MD5 signature file
        run: |
          md5sum build/* > build/go-mcp-smtp.md5
          cat build/go-mcp-smtp.md5

      - name: Expose build result
        run: ls -la build/

      - name: Release
        uses: ncipollo/release-action@v1.14.0
        with:
          draft: true
          name: "Release ${{ github.sha }}"
          body: |
            Code is generated from commit https://github.com/vodolaz095/go-mcp-smtp/commit/${{ github.sha }}

            ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: true
          commit: ${{ github.sha }}
          tag: v${{ github.run_number }}
          artifacts: "build/go-mcp-smtp*"

